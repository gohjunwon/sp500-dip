name: research-swing
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas lxml
      - run: python research/swing_events.py
      - name: commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add research/swing_events.json.gz
          git commit -m "스윙 연구 데이터" || echo "no changes"
          git pull --rebase -X theirs || true
          git push
