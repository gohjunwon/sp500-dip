name: update-data
on:
  schedule:
    # 30분마다 현재가·뉴스 갱신은 Cloudflare 알람이 보냅니다(mode=live).
    - cron: "17 22 * * 1-5"        # 장 마감 후(한국 오전 7:17): 전체(실적·전망 포함)
    # 미국장 시작 1시간 전(뉴욕 8:30) 보장 갱신: 서머타임/겨울 두 줄, 뉴욕 8:00~9:30일 때만 실제로 돎(GitHub 지연 허용)
    - cron: "5 12 * * 1-5"         # 서머타임(EDT) 뉴욕 8:05 (GitHub 지연 대비 한 번 더)
    - cron: "20 12 * * 1-5"        # 서머타임(EDT) 뉴욕 8:20
    - cron: "5 13 * * 1-5"         # 겨울(EST) 뉴욕 8:05
    - cron: "20 13 * * 1-5"        # 겨울(EST) 뉴욕 8:20
  workflow_dispatch:
    inputs:
      mode:
        description: "full = 전체(하루 1번), preopen = 개장 1시간 전(현재가+일봉·악재), live = 현재가·뉴스만(30분 알람용)"
        default: full
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas
      - name: collect
        run: |
          MODE="${{ github.event.inputs.mode }}"
          SCHED="${{ github.event.schedule }}"
          case "$SCHED" in "5 12 * * 1-5"|"20 12 * * 1-5"|"5 13 * * 1-5"|"20 13 * * 1-5") PRE=1;; *) PRE=0;; esac
          if [ "$PRE" = 1 ]; then
            HM=$((10#$(TZ=America/New_York date +%H%M)))
            if [ "$HM" -lt 800 ] || [ "$HM" -gt 930 ]; then echo "뉴욕 $HM — 개장 1시간 전 시간대가 아니라 건너뜀"; exit 0; fi
            MODE=preopen
          fi
          if [ "$MODE" = "preopen" ]; then
            python scripts/collect.py meta live prices risk40   # 개장 전: 현재가 + 일봉·악재 판정까지 최신화
          elif [ "$MODE" = "live" ]; then
            python scripts/collect.py meta live risk40   # 현재가·관심종목 뉴스만 (가볍게)
          else
            python scripts/collect.py
          fi
      - name: commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data
          git diff --staged --quiet && { echo "바뀐 자료 없음 → 커밋 안 함"; exit 0; }
          git commit -q -m "data update $(date -u +%F' '%H:%M)"
          for i in 1 2 3; do git pull -q --rebase -X theirs && git push -q && exit 0; sleep 5; done
          exit 1
