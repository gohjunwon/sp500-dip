name: update-data
on:
  schedule:
    # 30분마다 현재가·주가·악재 갱신은 Cloudflare 알람이 보냅니다(mode=live).
    - cron: "17 22 * * 1-5"        # 장 마감 후(한국 오전 7:17): 전체(실적·전망 포함)
  workflow_dispatch:
    inputs:
      mode:
        description: "full = 전체, live = 현재가만(30분 알람용)"
        default: full
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas
      - name: collect
        run: |
          if [ "${{ github.event.inputs.mode }}" = "live" ]; then
            python scripts/collect.py meta live prices risk40
          else
            python scripts/collect.py
          fi
      - name: commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data
          git commit -m "data update $(date -u +%F' '%H:%M)" || echo "no changes"
          git pull --rebase -X theirs || true
          git push
