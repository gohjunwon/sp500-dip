name: update-data
on:
  schedule:
    - cron: "17 22 * * 1-5"   # 미국장 마감 후 (한국시간 오전 7:17)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas
      - run: python scripts/collect.py
      - name: commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data
          git commit -m "data update $(date -u +%F)" || echo "no changes"
          git push
