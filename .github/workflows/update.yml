name: update-data
on:
  schedule:
    - cron: "*/30 9-23 * * 1-5"    # 프리마켓~애프터마켓(한국 저녁 6시~아침 8시) 30분마다: 현재가·주가·악재
    - cron: "17 22 * * 1-5"        # 장 마감 후(한국 오전 7:17): 전체(실적·전망 포함)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas
      - name: collect
        run: |
          if [ "${{ github.event.schedule }}" = "*/30 9-23 * * 1-5" ]; then
            python scripts/collect.py meta live prices risk40
          else
            python scripts/collect.py
          fi
      - name: commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data
          git commit -m "data update $(date -u +%F' '%H:%M)" || echo "no changes"
          git pull --rebase -X theirs || true
          git push
